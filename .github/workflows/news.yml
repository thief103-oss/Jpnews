name: 증평 뉴스 수집

on:
  schedule:
    - cron: "0 * * * *"      # 매시 정각 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul          # 한국 시간 기준으로 시간대 묶기
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python news_scraper.py --ci
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add news.db index.html
          git commit -m "뉴스 업데이트 $(date '+%m-%d %H:%M')" || echo "새 기사 없음"
          git push
